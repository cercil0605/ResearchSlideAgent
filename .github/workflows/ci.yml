name: test-and-image
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: node --test scripts/publish-deployment.test.cjs
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-impress poppler-utils fonts-noto-cjk
      - run: npm ci --ignore-scripts && npm run build
        working-directory: ui
      - run: uv sync --frozen && uv run ruff check src tests && uv run pytest -q
      - name: Verify bundled lab template
        run: uv run python scripts/template_smoke.py
      - name: Validate PowerPoint XML with the Microsoft SDK
        run: |
          uv run python scripts/render_spec.py examples/eggs.slidespec.json --output artifacts/canonical-eggs
          uv run python scripts/preview_smoke.py
          dotnet run --project tools/pptx-validator --configuration Release -- templates/lab-template.pptx artifacts/template-check/presentation.pptx artifacts/canonical-eggs/presentation.pptx artifacts/narrative-check/presentation.pptx
  image:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64,linux/amd64
          build-args: RSA_CODE_COMMIT=${{ github.sha }}
          tags: ${{ steps.image.outputs.name }}:latest,${{ steps.image.outputs.name }}:${{ github.sha }}
  deployment:
    if: github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Publish tested image for Portainer
        uses: actions/github-script@v8
        with:
          script: |
            const publish = require('./scripts/publish-deployment.cjs');
            await publish({github, context, core});
