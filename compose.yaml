name: research-slide-agent
x-runtime: &runtime
  image: ghcr.io/cercil0605/researchslideagent:56286001ba12a4823866dcb848583a483b79b5bd
  restart: unless-stopped
  init: true
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:size=512m,mode=1777
    - /home/app:size=64m,uid=10001,gid=10001
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  volumes:
    - research_data:/data
  environment: &env
    RSA_ENV: production
    RSA_DEV: "0"
    RSA_DATA_DIR: /data
    RSA_TEMPLATE: /templates/lab-template.pptx
    RSA_AUTH_MODE: ${RSA_AUTH_MODE:-oauth}
    RSA_CF_TEAM_DOMAIN: ${RSA_CF_TEAM_DOMAIN:-}
    RSA_CF_AUDIENCE: ${RSA_CF_AUDIENCE:-}
    RSA_ALLOWED_EMAILS: ${RSA_ALLOWED_EMAILS:-}
    RSA_BASE_URL: ${RSA_BASE_URL:?Set public HTTPS URL}
    RSA_OAUTH_ISSUER: ${RSA_OAUTH_ISSUER:-}
    RSA_JWKS_URL: ${RSA_JWKS_URL:-}
    RSA_OAUTH_AUDIENCE: ${RSA_OAUTH_AUDIENCE:-}
    RSA_WEB_CLIENT_ID: ${RSA_WEB_CLIENT_ID:-research-slide-web}
    RSA_ALLOWED_SUBS: ${RSA_ALLOWED_SUBS:-}
    RSA_SESSION_KEY: ${RSA_SESSION_KEY:?Set 32+ random characters}
    RSA_ATTACHMENT_HOSTS: ${RSA_ATTACHMENT_HOSTS-*.oaiusercontent.com}
    RSA_WORKER_LIMIT: "1"
  logging:
    driver: none
services:
  api:
    <<: *runtime
    ports: ["127.0.0.1:8010:8000"]
    command: ["rsa", "serve"]
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health',headers={'Host':__import__('urllib.parse',fromlist=['urlparse']).urlparse(__import__('os').environ['RSA_BASE_URL']).netloc}); urllib.request.urlopen(r)"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    <<: *runtime
    command: ["rsa", "worker"]
    network_mode: none
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    stop_grace_period: 10m
volumes:
  research_data:
